name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build packaged backend
        shell: pwsh
        run: ./scripts/build-backend.ps1 -Python python
      - name: Build installer
        working-directory: desktop
        run: |
          npm install
          if ("${{ github.ref_type }}" -eq "tag") { npm version $env:GITHUB_REF_NAME.Substring(1) --no-git-tag-version }
          npm run dist
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clotho-Windows-installer
          path: desktop/release/Clotho-Setup-*.exe
      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/Clotho-Setup-*.exe
